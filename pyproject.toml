[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builderguild"
version = "0.1.0"
description = "Autonomous software engineering legion"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pip-audit"]

[project.scripts]
builderguild = "builderguild.cli:main"

[tool.setuptools.packages.find]
where = ["builderguild"]
include = ["builderguild*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["builderguild"]