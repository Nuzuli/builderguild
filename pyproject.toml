[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builderguild"
version = "0.1.0"
description = "Autonomous software engineering legion"
requires-python = ">=3.10"

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pip-audit", "mypy"]

[project.scripts]
builderguild = "builderguild.cli:main"

[tool.setuptools.packages.find]
where = ["builderguild"]
include = ["builderguild*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "builderguild"]

[tool.mypy]
python_version = "3.10"
mypy_path = "builderguild"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true